{% set name = "python-dateutil" %}
{% set version = "3.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/0e/df/f15f80383f152452d8985b36d95cb8751f901a3e0ff4cd27f7e118f168e2/python_dateutil-{{ version }}.tar.gz
  sha256: 7ebcb3c29a92f3ceafe79a7a48a5c45677e9e004bbeec5742ac0bbb00560b7a2

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
    - setuptools_scm <8.0
  run:
    - python
    - six >=1.6
    - tzdata

test:
  requires:
    - pip
    - importlib_metadata
  imports:
    - dateutil
    - dateutil.relativedelta
    - dateutil.rrule
    - dateutil.parser
    - dateutil.tz
    - dateutil.zoneinfo
    - dateutil.utils
  commands:
    - pip check

about:
  home: https://dateutil.readthedocs.io/
  license: BSD-3-Clause and Apache-2.0
  license_family: BSD
  license_file: LICENSE
  summary: Extensions to the standard Python datetime module
  description: |
    The dateutil module provides powerful extensions to the standard datetime
    module, available in Python.
  doc_url: https://dateutil.readthedocs.io/
  dev_url: https://github.com/dateutil/dateutil/

extra:
  recipe-maintainers:
    - pganssle
    - msarahan
    - ocefpaf
