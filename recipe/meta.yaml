{% set name = "python-dateutil" %}
{% set version = "4.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/18/39/b3927f3616f6223832f9b760e4208e8a7c7e1dea2b4d9ad7d32a5d214c3a/python_dateutil-{{ version }}.tar.gz
  sha256: d7295ff14fdc0f92f662100bfb6c551d160ca090f2939f1ec5b9794265c03f06

build:
  number: 0
  skip: True  # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - wheel
    - hatchling >=1.27
    - hatch-vcs >=0.4
    - hatch-fancy-pypi-readme >=24.1
  run:
    - python
    - python-tzdata

test:
  requires:
    - pip
    - importlib_metadata
  imports:
    - dateutil
    - dateutil.relativedelta
    - dateutil.rrule
    - dateutil.parser
    - dateutil.tz
    - dateutil.zoneinfo
    - dateutil.utils
  commands:
    - pip check

about:
  home: https://dateutil.readthedocs.io/
  license: BSD-3-Clause and Apache-2.0
  license_family: BSD
  license_file: LICENSE
  summary: Extensions to the standard Python datetime module
  description: |
    The dateutil module provides powerful extensions to the standard datetime
    module, available in Python.
  doc_url: https://dateutil.readthedocs.io/
  dev_url: https://github.com/dateutil/dateutil/

extra:
  recipe-maintainers:
    - pganssle
    - msarahan
    - ocefpaf
